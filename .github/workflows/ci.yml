name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          # Windows : PowerShell, console, règles de risque PowerShell
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install -e . -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Run test suite
        run: pytest tests/ -v

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ezsh --version
          Invoke-Expression (& ezsh init powershell | Out-String)
          if (-not $env:EZSH_SESSION) { throw "hook not loaded" }
          $env:EZSH_MOCK_LLM = "1"
          ezsh run -- python -c "import sys; sys.exit(3)"
          if ($LASTEXITCODE -ne 3) { throw "ezsh run exit code: $LASTEXITCODE" }
          ezsh --explain "npm: command not found"
