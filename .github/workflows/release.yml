name: Release to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # to create GitHub Release
      id-token: write   # for trusted publishing (optional future use)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          VERSION="$(python -c 'from src import __version__; print(__version__)')"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Le tag $GITHUB_REF_NAME ne correspond pas à src/__init__.py ($VERSION)" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '$0 ~ "^## "v"([ ]|$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > release_notes.md
          if ! grep -q '[^[:space:]]' release_notes.md; then
            echo "Aucune section $VERSION dans CHANGELOG.md" >&2
            exit 1
          fi

      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel build twine

      - name: Build distribution
        run: python -m build

      - name: Check dist with twine
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload --skip-existing dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
