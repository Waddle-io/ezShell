line-length = 100
target-version = "py310"

[lint]
select = ["E", "F", "W", "I"]
ignore = []


[lint.per-file-ignores]
# Tables de textes (prompts, libellés FR/EN) : on ne coupe pas les phrases.
"src/core/provider.py" = ["E501"]
"src/ui/panel.py" = ["E501"]
"src/core/redact.py" = ["E501"]
# Import différé volontaire : le filtre de warnings CustomTkinter doit précéder l'import.
"src/ui/gui_window.py" = ["E402", "E501"]
"src/core/prompts.py" = ["E501"]
"src/i18n.py" = ["E501"]
"src/core/shell_hook.py" = ["E501"]
"src/ui/render.py" = ["E501"]
"src/app.py" = ["E501"]
"src/main.py" = ["E501"]
"src/ui/chat_tui.py" = ["E501"]
